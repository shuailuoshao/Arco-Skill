approved_view_designs:
  back:
    definition:
      schema_version: 1
      fixed_constraints:
      - 延续正式阿尔可正面和右斜侧参考的冰银浅蓝长发、粉色发梢、纤细修长体型和既有相对比例。
      - 后方长发自然披散，保持前后相容的发量、发长和发梢层次；头饰和其他服装饰物由各套装单独决定。
      - 此标定只建立全局复用的后脑发束与背面身体轮廓，衣服使用正式常服作遮蔽，不登记新的常服背面设计。
      completion_decisions:
      - 后脑到后背的未见发束连接采用自然散发的连续层次，不新增编发、扎发或改变发长；按两张正式图中发梢相对腰臀的位置补齐后方发尾。
    approval_context:
      user_confirmed: true
      user_message: 确认
