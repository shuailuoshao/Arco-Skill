design_definition:
  schema_version: 1
  design_id: white-garters-large-bow
  parts:
    upper:
      origin: source
      description: 黑色收腰连衣裙上身：闭合白色圆角翻领、泡泡肩袖接窄长袖、宽白袖口，保留两颗袖口扣；与下装同属一件连衣裙。
      source_bindings:
      - source_id: dress-structure
        part_id: dress-front-upper
      - source_id: dress-structure
        part_id: dress-back-upper
      - source_id: dress-structure
        part_id: cuff-construction
      - source_id: worn-front
        part_id: worn-bodice
      - source_id: assembled-structure
        part_id: assembled-front
      fixed_features:
      - 保留原款闭合领口、收腰结构和长袖长度。
      - 白袖口保持宽阔，袖口扣作为稳定外观细节。
    lower:
      origin: source
      description: 黑色宽大长裙与上身相连，长度接近足踝、主要露鞋尖；腰部起褶，内穿白色层叠衬裙保持自然饱满廓形。
      source_bindings:
      - source_id: dress-structure
        part_id: dress-front-skirt
      - source_id: dress-structure
        part_id: dress-back-skirt
      - source_id: worn-front
        part_id: worn-skirt
      - source_id: petticoat-detail
        part_id: soft-petticoat
      fixed_features:
      - 长裙保持原款长度和连续黑色下摆。
      - 围裙的白色下摆高于黑裙下摆，保留清楚的一圈黑裙边。
      - 衬裙平时位于外裙内，不改变原款长裙的正常垂落。
    footwear:
      origin: completion
      description: 黑色素面闭口圆头低跟鞋，一双；约2厘米低跟，简洁鞋面，无额外鞋面蝴蝶结或金属饰件。
      source_bindings: []
      fixed_features:
      - 黑色、圆头、闭口、低跟、素面。
      decision_reason: 原图只露鞋尖，完整鞋型没有确定；采用之前推荐的简洁圆头低跟方案作为待验收补全。
    hosiery:
      origin: completion
      description: 一对白色不透明吊带长袜，袜口到大腿上部，配白色吊袜腰带与四条白色吊带（每腿前后各一条），以小型素面吊袜夹连接平整袜口；正常穿着时位于长裙与衬裙内。
      source_bindings: []
      fixed_features:
      - 用户明确指定白色吊带袜，必须是左右分开的长袜，通过吊带固定。
      - 白色袜身和平整袜口保持不透明布面，吊带与腰带均为白色。
      - 主穿着图保持完整长裙；连接结构通过衣物细节图呈现。
      decision_reason: 品类与白色来自用户文字；参考未清楚给出袜口、腰带及夹子的款式，采用素面白色腰带、四吊带和小夹作为具体补全，等待设计与试穿计划确认。
    accessories:
      origin: source
      description: 白色胸兜式长围裙，腰带在后腰系大蝴蝶结，白色肩带在背部交叉，肩带外侧有白色大褶边；白色荷叶边头箍；白领下方一只黑色大蝴蝶结。
      source_bindings:
      - source_id: apron-structure
        part_id: apron-front
      - source_id: apron-structure
        part_id: apron-back
      - source_id: assembled-structure
        part_id: assembled-back
      - source_id: worn-front
        part_id: worn-apron
      - source_id: headdress-detail
        part_id: ruffled-headband
      - source_id: shoulder-frill-detail
        part_id: apron-shoulder-frill
      - source_id: neckwear-detail
        part_id: large-neck-bow
      fixed_features:
      - 采用用户选定的弧形荷叶边头箍和大黑色蝴蝶结。
      - 后背X形肩带、肩部白褶边、后腰大蝴蝶结及两条垂尾保持一致。
      - 围裙覆盖连衣裙胸腹和裙身前方，白色胸兜与腰带连接清楚。
    outerwear:
      origin: omitted
      description: 不加外套或披肩。
      source_bindings: []
      fixed_features: []
  wearing_relations:
  - 黑色上身和黑色长裙是一件收腰连衣裙，白色衬裙位于其内层。
  - 白色围裙穿在黑色连衣裙外，胸兜接腰带，肩带从胸兜向上经过肩部并在背部交叉，腰带在后腰居中系结。
  - 肩部白色褶边属于围裙肩带，位于黑色泡泡袖上方；大黑色领结位于白领正下方、围裙胸兜上沿附近。
  - 白色吊袜腰带、四条吊带和一对白色长袜位于裙内；袜身覆盖足部并进入黑色闭口鞋。
  - 荷叶边头箍佩戴于阿尔可头顶发丝上，保留既有刘海、披散长发和粉色发梢。
  - 背面穿着图保留自然披散长发的遮挡；完整肩带与蝴蝶结构造通过无头发的衣物细节图补充。
  fixed_constraints:
  - 新增为一套完整固定的黑白长裙女仆装，保留原裙长度、原袖长和闭合领口。
  - 身份、发型、体型比例与画风使用正式阿尔可基准；教程人物仅提供指定衣服区域。
  - 普通穿着参考采用全身中立站姿、清晰浅色背景和无五官形式。
  - 吊带长袜为白色；领饰为大黑色蝴蝶结；头饰为白色荷叶边头箍。
  - 主图与后续视图均依据获认可的同一设计；未认可候选不作为其他视图设计依据。
  detail_requirements:
  - view_id: detail-back-apron
    description: 衣物单独展示：黑色连衣裙和白围裙的背面上身到后腰，完整显示X形肩带、肩部褶边、腰带和后腰大蝴蝶结及垂尾；无头发遮挡，浅色背景，不改变人物的正常披散发型。
    source_ids:
    - dress-structure
    - apron-structure
    - shoulder-frill-detail
  - view_id: detail-trims
    description: 同一套装的服装细节页：白色荷叶边头箍、白领配大黑蝴蝶结、宽白袖口和两颗扣；分成清楚的衣物局部小图，浅色背景，保持主图款式。
    source_ids:
    - headdress-detail
    - shoulder-frill-detail
    - neckwear-detail
  - view_id: detail-hosiery-footwear
    description: 衣物单独平铺展示：一对白色不透明大腿长袜、白色吊袜腰带、四条连接吊带及小型素面夹子，旁边配一双黑色素面圆头闭口低跟鞋。清晰展示连接关系、袜口和鞋型；不呈现人体或提裙动作。
    source_ids: []
  gap_resolutions:
