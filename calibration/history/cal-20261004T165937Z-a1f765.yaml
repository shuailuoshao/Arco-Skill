        hosiery:
          origin: completion
          description: 一对白色不透明吊带长袜，袜口到大腿上部，配白色吊袜腰带与四条白色吊带（每腿前后各一条），以小型素面吊袜夹连接平整袜口；正常穿着时位于长裙与衬裙内。
          source_bindings: []
          fixed_features:
          - 用户明确指定白色吊带袜，必须是左右分开的长袜，通过吊带固定。
          - 白色袜身和平整袜口保持不透明布面，吊带与腰带均为白色。
          - 主穿着图保持完整长裙；连接结构通过衣物细节图呈现。
          decision_reason: 品类与白色来自用户文字；参考未清楚给出袜口、腰带及夹子的款式，采用素面白色腰带、四吊带和小夹作为具体补全，等待设计与试穿计划确认。
        accessories:
          origin: source
          description: 白色胸兜式长围裙，腰带在后腰系大蝴蝶结，白色肩带在背部交叉，肩带外侧有白色大褶边；白色荷叶边头箍；白领下方一只黑色大蝴蝶结。
