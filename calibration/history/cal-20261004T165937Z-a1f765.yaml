          - source_id: shoulder-frill-detail
            part_id: apron-shoulder-frill
          - source_id: neckwear-detail
            part_id: large-neck-bow
          fixed_features:
          - 采用用户选定的弧形荷叶边头箍和大黑色蝴蝶结。
          - 后背X形肩带、肩部白褶边、后腰大蝴蝶结及两条垂尾保持一致。
          - 围裙覆盖连衣裙胸腹和裙身前方，白色胸兜与腰带连接清楚。
        outerwear:
          origin: omitted
          description: 不加外套或披肩。
          source_bindings: []
          fixed_features: []
      wearing_relations:
      - 黑色上身和黑色长裙是一件收腰连衣裙，白色衬裙位于其内层。
      - 白色围裙穿在黑色连衣裙外，胸兜接腰带，肩带从胸兜向上经过肩部并在背部交叉，腰带在后腰居中系结。
      - 肩部白色褶边属于围裙肩带，位于黑色泡泡袖上方；大黑色领结位于白领正下方、围裙胸兜上沿附近。
      - 白色吊袜腰带、四条吊带和一对白色长袜位于裙内；袜身覆盖足部并进入黑色闭口鞋。
      - 荷叶边头箍佩戴于阿尔可头顶发丝上，保留既有刘海、披散长发和粉色发梢。
      - 背面穿着图保留自然披散长发的遮挡；完整肩带与蝴蝶结构造通过无头发的衣物细节图补充。
      fixed_constraints:
      - 新增为一套完整固定的黑白长裙女仆装，保留原裙长度、原袖长和闭合领口。
      - 身份、发型、体型比例与画风使用正式阿尔可基准；教程人物仅提供指定衣服区域。
      - 普通穿着参考采用全身中立站姿、清晰浅色背景和无五官形式。
      - 吊带长袜为白色；领饰为大黑色蝴蝶结；头饰为白色荷叶边头箍。
      - 主图与后续视图均依据获认可的同一设计；未认可候选不作为其他视图设计依据。
