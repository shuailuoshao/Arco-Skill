      gap_resolutions:
        hosiery: 按用户明确要求设计一对白色吊带长袜；腰带、四条吊带、袜口和夹子采用素面白色补全。
        footwear: 黑色素面闭口圆头低跟鞋，约2厘米低跟，主体穿着图主要露鞋尖，完整鞋型由细节页展示。
        color_and_material: 将教程的灰阶外观落实为黑色连衣裙、白色围裙和衬裙、白色头箍与袜子、黑色大领结和鞋；采用哑光织物效果，小纽扣和夹子为简洁低光泽。
        rear_occlusion: 保留阿尔可既有披散长发；使用衣物背面细节图展示可能被遮挡的X形肩带和后腰系结。
