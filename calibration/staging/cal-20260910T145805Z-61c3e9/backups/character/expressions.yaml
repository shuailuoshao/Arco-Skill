schema_version: 1
entity_type: expression_catalog
entity_ref: character.expressions
revision: 0
last_calibration_id: null
scope: generic
expressions:
  - id: natural-soft-smile
    display_name_zh: 自然浅笑
    prompt_cue_zh: 眼神自然，嘴角轻微上扬，神态放松
    prompt_cue_en: relaxed eyes with a subtle upward curve at the corners of the mouth
  - id: happy-smile
    display_name_zh: 开心笑
    prompt_cue_zh: 眼神明亮，笑意清晰但不过度夸张
    prompt_cue_en: bright eyes and a clear, unexaggerated happy smile
  - id: shy-averted-gaze
    display_name_zh: 羞涩并回避视线
    prompt_cue_zh: 视线轻轻移开，表情克制而羞涩
    prompt_cue_en: a gently averted gaze with a restrained, shy expression
  - id: slight-surprise
    display_name_zh: 轻微惊讶
    prompt_cue_zh: 眼睛略微睁大，嘴唇轻启
    prompt_cue_en: slightly widened eyes and subtly parted lips
  - id: quiet-calm
    display_name_zh: 安静平和
    prompt_cue_zh: 眼睑自然，嘴角平稳，神态宁静
    prompt_cue_en: naturally resting eyelids, neutral mouth, and a tranquil expression
  - id: thoughtful
    display_name_zh: 若有所思
    prompt_cue_zh: 视线稍偏离镜头，神态专注而内敛
    prompt_cue_en: gaze slightly away from the camera, focused and introspective
  - id: sleepy
    display_name_zh: 困倦
    prompt_cue_zh: 眼睑微垂，表情松弛
    prompt_cue_en: lowered eyelids and a relaxed, drowsy expression
  - id: mildly-aggrieved
    display_name_zh: 轻微委屈
    prompt_cue_zh: 眉眼略显低落，嘴角轻轻收紧
    prompt_cue_en: subtly downcast brows and eyes with gently tightened lips
  - id: sad
    display_name_zh: 悲伤
    prompt_cue_zh: 目光低沉，表情克制，不夸张哭泣
    prompt_cue_en: lowered gaze and restrained sadness without exaggerated crying
  - id: tense
    display_name_zh: 紧张
    prompt_cue_zh: 视线专注，嘴角和下颌略微收紧
    prompt_cue_en: focused gaze with slight tension around the mouth and jaw
  - id: cool-detached
    display_name_zh: 冷淡
    prompt_cue_zh: 目光平直，表情克制，情绪距离感明显
    prompt_cue_en: level gaze and a restrained expression with emotional distance
  - id: angry
    display_name_zh: 生气
    prompt_cue_zh: 眉眼收紧，目光直接，保持自然面部结构
    prompt_cue_en: tightened brows and direct gaze while preserving natural facial structure
